name: Deploy to Railway

on:
  push:
    branches:
      - develop
      - deploy/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      SVC_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BANU_MUSA_HOLIDAY_SYNC_API_KEY: ${{ secrets.BANU_MUSA_HOLIDAY_SYNC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy service
        run: railway up --service=${{ env.SVC_ID }}

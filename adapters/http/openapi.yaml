        - name: employeeUid
          in: path
          required: true
          schema:
            type: string
          example: "emp_xyz789"
        - name: startDate
          in: query
          description: Accepts YYYY-MM-DD or RFC3339. Must be provided together with endDate. Cannot be combined with month or year.
          schema:
            type: string
          example: "2024-06-01"
        - name: endDate
          in: query
          description: Accepts YYYY-MM-DD or RFC3339. Must be provided together with startDate. Cannot be combined with month or year.
          schema:
            type: string
          example: "2024-06-30"
        - name: month
          in: query
          description: Month period in YYYY-MM format. Cannot be combined with year/startDate/endDate.
          schema:
            type: string
          example: "2024-06"
        - name: year
          in: query
          description: Year period in YYYY format. Cannot be combined with month/startDate/endDate.
          schema:
            type: string
          example: "2024"

                $ref: "#/components/schemas/Error"
        "409":
          description: Device is deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/attendance-devices/{uid}:
    get:
      tags: [Attendance Devices]
      summary: Get attendance device by UID
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "adev_001"
      responses:
        "200":
          description: Attendance device details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDevice"
        "400":
          description: Invalid UID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags: [Attendance Devices]
      summary: Update an attendance device
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "adev_001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceDeviceRequest"
      responses:
        "200":
          description: Device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDevice"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Device conflict (duplicate IP:port)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Attendance Devices]
      summary: Delete an attendance device
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "adev_001"
      responses:
        "200":
          description: Device deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Device deactivated"
        "400":
          description: Invalid UID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/attendance-devices/{uid}/activate:
    patch:
      tags: [Attendance Devices]
      summary: Activate a deactivated attendance device
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "adev_001"
      responses:
        "200":
          description: Device activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Device activated"
        "400":
          description: Invalid UID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Device already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── DEVICE TOKENS ───────────────────────────────────────────────────────────

  /api/v1/device-tokens:
    post:
      tags: [Device Tokens]
      summary: Register a device token for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  example: "fcm_token_abc123"
                platform:
                  type: string
                  enum: [android, ios]
                  example: "android"
      responses:
        "201":
          description: Token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    example: "dt_001"

  /api/v1/device-tokens/{uid}:
    delete:
      tags: [Device Tokens]
      summary: Unregister a device token
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "dt_001"
      responses:
        "200":
          description: Token unregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Device token unregistered"

  # ─── AUDIT ───────────────────────────────────────────────────────────────────

  /api/v1/audit/entity/{entityType}/{entityUID}:
    get:
      tags: [Audit]
      summary: Get audit trail for an entity
      description: |
        Retrieves the complete audit history for a specific entity.
        Returns all audit events ordered by occurrence time (newest first).
        Requires `audit:read` permission.
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
          example: "attendance_record"
          description: |
            Type of entity to retrieve audit trail for.
            Valid values: attendance_record, leave_request, leave_record, approval_request,
            employee, user, department, role, approval_flow, approval_flow_step, leave_type,
            shift, attendance_device, leave_balance
        - name: entityUID
          in: path
          required: true
          schema:
            type: string
          example: "atr_001"
          description: Unique identifier of the entity
      responses:
        "200":
          description: Audit trail retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                          example: "aud_xyz789"
                        actorUid:
                          type: string
                          example: "emp_admin_001"
                        action:
                          type: string
                          example: "update"
                          description: |
                            Action performed. Common values: create, update, delete, approve, reject,
                            cancel, submit, assign_role, remove_role, assign_department, remove_department,
                            adjust_balance, deduct_balance, add_step, update_step, delete_step
                        entityType:
                          type: string
                          example: "attendance_record"
                        entityUid:
                          type: string
                          example: "atr_001"
                        meta:
                          type: string
                          nullable: true
                          example: '{"old_check_in":"2024-01-15T08:00:00Z","new_check_in":"2024-01-15T08:05:00Z"}'
                          description: JSON string containing action-specific metadata (field changes, comments, etc.)
                        occurredAt:
                          type: string
                          format: date-time
                          example: "2024-01-15T10:30:00Z"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-15T10:30:01Z"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/audit/actor/{actorUID}:
    get:
      tags: [Audit]
      summary: Get audit events by actor
      description: |
        Retrieves all audit events performed by a specific actor (employee).
        Returns paginated results ordered by occurrence time (newest first).
        Requires `audit:read` permission.
      parameters:
        - name: actorUID
          in: path
          required: true
          schema:
            type: string
          example: "emp_admin_001"
          description: Unique identifier of the actor (employee UID)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
          description: Page number (1-indexed)
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 20
          description: Number of events per page (1-100)
      responses:
        "200":
          description: Actor audit events retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                          example: "aud_abc123"
                        actorUid:
                          type: string
                          example: "emp_admin_001"
                        action:
                          type: string
                          example: "approve"
                          description: |
                            Action performed. Common values: create, update, delete, approve, reject,
                            cancel, submit, assign_role, remove_role, assign_department, remove_department,
                            adjust_balance, deduct_balance, add_step, update_step, delete_step
                        entityType:
                          type: string
                          example: "leave_request"
                        entityUid:
                          type: string
                          example: "lr_456"
                        meta:
                          type: string
                          nullable: true
                          example: '{"comments":"Approved for medical reasons"}'
                          description: JSON string containing action-specific metadata (field changes, comments, etc.)
                        occurredAt:
                          type: string
                          format: date-time
                          example: "2024-01-15T14:20:00Z"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-15T14:20:01Z"
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20
                  hasNextPage:
                    type: boolean
                    example: false
        "400":
          description: Invalid request parameters (invalid page, page_size out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/audit/logs:
    get:
      tags: [Audit]
      summary: List all audit logs with filters
      description: |
        Retrieves all audit logs with optional filtering capabilities.
        Returns paginated results ordered by occurrence time (newest first).
        Requires `audit:read` permission.

        This endpoint allows filtering by:
        - Entity type (category)
        - Actor UID (who performed the action)
        - Free text search across entity_uid, action, and metadata
      parameters:
        - name: entity_type
          in: query
          schema:
            type: string
          example: "leave_request"
          description: |
            Filter by entity type. Valid values: attendance_record, leave_request, leave_balance,
            employee, user, role, department, attendance_device, holiday, approval_flow, leave_type
        - name: actor_uid
          in: query
          schema:
            type: string
          example: "emp_admin_001"
          description: Filter by actor UID (employee who performed the action)
        - name: search
          in: query
          schema:
            type: string
          example: "approved"
          description: Free text search across entity_uid, action, and metadata fields
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
          description: Page number (1-indexed)
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          example: 50
          description: Number of events per page (1-100)
      responses:
        "200":
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                          example: "aud_xyz789"
                        actorUid:
                          type: string
                          example: "emp_admin_001"
                        action:
                          type: string
                          example: "update"
                          description: |
                            Action performed. Common values: create, update, delete, approve, reject,
                            cancel, submit, assign_role, remove_role, assign_department, remove_department,
                            adjust_balance, deduct_balance, add_step, update_step, delete_step, activate, deactivate
                        entityType:
                          type: string
                          example: "leave_request"
                          description: |
                            Type of entity. Common values: attendance_record, leave_request, leave_balance,
                            employee, user, role, department, attendance_device, holiday, approval_flow, leave_type
                        entityUid:
                          type: string
                          example: "lr_456"
                        meta:
                          type: string
                          nullable: true
                          example: '{"old_status":"pending","new_status":"approved","comments":"Approved for medical reasons"}'
                          description: JSON string containing action-specific metadata (field changes, comments, etc.)
                        occurredAt:
                          type: string
                          format: date-time
                          example: "2024-01-15T14:20:00Z"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-15T14:20:01Z"
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 50
                  hasNextPage:
                    type: boolean
                    example: true
                    description: Indicates if there are more pages available
        "400":
          description: Invalid request parameters (invalid page, page_size out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── PERMISSION REQUESTS ───────────────────────────────────────────────────

  /api/v1/permission-requests/eligibility:
    get:
      tags: [Permissions]
      summary: Get permission eligibility
      description: |
        Returns the calling employee's effective shift and eligibility per permission type:
        allowed submission dates, whether the weekly cap is hit, and the resolved time window.
        Requires `permission:request`.
      responses:
        "200":
          description: Eligibility data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEligibility"
        "400":
          description: No employee profile linked to user

  /api/v1/permission-requests:
    post:
      tags: [Permissions]
      summary: Submit a permission request
      description: |
        Creates a new permission request for the calling employee.
        The time window is resolved at submission from the employee's shift:
        - **morning / personal** — system constants (10:00 / 13:00); caller-supplied times are ignored.
        - **official / health_insurance** — caller must supply `startTime` and `endTime` inside the shift.

        Requires `permission:request`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, permissionDate]
              properties:
                type:
                  type: string
                  enum: [morning, personal, official, health_insurance]
                  example: "morning"
                permissionDate:
                  type: string
                  format: date
                  example: "2026-05-05"
                startTime:
                  type: string
                  description: "HH:MM. Required for official / health_insurance."
                  example: "10:00"
                  nullable: true
                endTime:
                  type: string
                  description: "HH:MM. Required for official / health_insurance."
                  example: "12:00"
                  nullable: true
                reason:
                  type: string
                  nullable: true
                  example: "Medical check-up"
      responses:
        "201":
          description: Permission request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionRequest"
        "400":
          description: Validation error (deadline passed, window outside shift, weekly cap exceeded, overlap, etc.)

    get:
      tags: [Permissions]
      summary: List permission requests
      description: |
        Lists permission requests. Without `scope=all` returns only the calling employee's requests.
        `scope=all` requires `permission:approve` or `permission:read`.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [self, all]
          example: "self"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
        - name: type
          in: query
          schema:
            type: string
            enum: [morning, personal, official, health_insurance]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionRequest"
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer

  /api/v1/permission-requests/{uid}:
    get:
      tags: [Permissions]
      summary: Get a permission request
      description: Returns a single permission request with `actorCanApprove` set for the calling user.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "prq_90dbbad336c74acf8f80b26644139b9d"
      responses:
        "200":
          description: Permission request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionRequest"
        "404":
          description: Not found

    patch:
      tags: [Permissions]
      summary: Update a pending permission request
      description: |
        Edits a **pending** permission request owned by the calling employee.
        Requires `permission:request`.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, permissionDate]
              properties:
                type:
                  type: string
                  enum: [morning, personal, official, health_insurance]
                permissionDate:
                  type: string
                  format: date
                startTime:
                  type: string
                  nullable: true
                endTime:
                  type: string
                  nullable: true
                reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated permission request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionRequest"
        "400":
          description: Validation error or request not editable
        "403":
          description: Not the request owner
        "404":
          description: Not found

  /api/v1/permission-requests/{uid}/cancel:
    post:
      tags: [Permissions]
      summary: Cancel a permission request
      description: |
        Cancels a pending or approved permission request owned by the calling employee.
        If the request was already approved, attendance for that day is recomputed.
        Requires `permission:request`.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "permission cancelled"
        "400":
          description: Request cannot be cancelled (already rejected/cancelled)
        "403":
          description: Not the request owner

  # ─── PERMISSION APPROVALS ──────────────────────────────────────────────────

  /api/v1/permission-approvals/pending:
    get:
      tags: [Permissions]
      summary: List pending permission approvals
      description: Returns all pending permission requests the calling user is authorized to approve. Requires `permission:approve`.
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingPermissionApproval"

  /api/v1/permission-approvals/{uid}/approve:
    post:
      tags: [Permissions]
      summary: Approve a permission request
      description: |
        Approves the permission request linked to the given approval-request UID.
        On final approval, attendance for the permission date is recomputed immediately.
        Requires `permission:approve`.
      parameters:
        - name: uid
          in: path
          required: true
          description: approval-request UID
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionRequest"
        "400":
          description: Request is not pending
        "403":
          description: Not an authorized approver
        "404":
          description: Not found

  /api/v1/permission-approvals/{uid}/reject:
    post:
      tags: [Permissions]
      summary: Reject a permission request
      description: Requires `permission:approve`. Comments are mandatory.
      parameters:
        - name: uid
          in: path
          required: true
          description: approval-request UID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comments]
              properties:
                comments:
                  type: string
                  example: "Insufficient justification"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "permission rejected"
        "400":
          description: Comments missing or request not pending
        "403":
          description: Not an authorized approver

  /api/v1/permission-approvals/{uid}/history:
    get:
      tags: [Permissions]
      summary: Get approval history for a permission request
      description: Returns the full action log (submit → approve/reject/cancel). Requires `permission:approve`.
      parameters:
        - name: uid
          in: path
          required: true
          description: approval-request UID
          schema:
            type: string
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionApprovalHistoryItem"
        "404":
          description: Not found

  /api/v1/employees/{uid}/permission-requests:
    get:
      tags: [Permissions]
      summary: List permission requests for an employee
      description: |
        Returns permission requests for a specific employee.
        Requires `employees:read`, `permission:approve`, or `permission:read`.
      parameters:
        - name: uid
          in: path
          required: true
          description: Employee UID
          schema:
            type: string
          example: "emp_00000000000000000000000000000002"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
        - name: type
          in: query
          schema:
            type: string
            enum: [morning, personal, official, health_insurance]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionRequest"
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "404":
          description: Employee not found

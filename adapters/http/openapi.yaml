          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate/conflicting attendance log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/attendance/logs/{uid}:
    patch:

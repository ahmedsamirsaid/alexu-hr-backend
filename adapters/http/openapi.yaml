                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20

  # ─── LEAVE REQUESTS ──────────────────────────────────────────────────────────

  /api/v1/leave-requests:
    post:
      tags: [Leave Requests]
      summary: Submit a leave request
      description: Employee submits a leave request for approval. Auto-approved if no approval flow is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveTypeUid, startDate, endDate]
              properties:
                employeeUid:
                  type: string
                  nullable: true
                  description: Optional target employee UID for delegated submission. If omitted, the authenticated user's linked employee is used.
                  example: "emp_xyz789"
                leaveTypeUid:
                  type: string
                  example: "lt_annual"
                subLeaveTypeUid:
                  type: string
                  nullable: true
                  example: "slt_001"
                sub_leave_type_uid:
                  type: string
                  nullable: true
                  example: "slt_001"
                startDate:
                  type: string
                  format: date
                  example: "2024-06-01"
                endDate:
                  type: string
                  format: date
                  example: "2024-06-05"
                notes:
                  type: string
                  example: "Family trip"
      responses:
        "201":
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [Leave Requests]
      summary: List my leave requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated leave requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveRequest"
                  total:
                    type: integer
                    example: 5
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20

  /api/v1/leave-requests/{uid}:
    get:
      tags: [Leave Requests]
      summary: Get a leave request by UID
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "req_001"
      responses:
        "200":
          description: Leave request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Leave Requests]
      summary: Edit a rejected leave request
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "req_001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leaveTypeUid:
                  type: string
                  example: "lt_annual"
                subLeaveTypeUid:
                  type: string
                  nullable: true
                  example: "slt_001"
                startDate:
                  type: string
                  format: date
                  example: "2024-06-10"
                endDate:
                  type: string
                  format: date
                  example: "2024-06-12"
                notes:
                  type: string
                  example: "Updated request"
                documents:
                  type: array
                  items:
                    type: object
                    required: [fileName, contentType]
                    properties:
                      fileName:
                        type: string
                        example: "medical-report.pdf"
                      contentType:
                        type: string
                        example: "application/pdf"
      responses:
        "200":
          description: Leave request updated and re-opened for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "404":
          description: Leave request or document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/leave-requests/{uid}/cancel:
    post:
      tags: [Leave Requests]
      summary: Cancel a leave request
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "req_001"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Leave request cancelled successfully"
        "400":
          description: Cannot cancel (wrong status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


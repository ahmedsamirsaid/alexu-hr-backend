          description: Monthly attendance statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyAttendanceStatsResponse"
        "400":
          description: Invalid employee UID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


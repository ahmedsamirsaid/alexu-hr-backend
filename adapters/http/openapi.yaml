  # ─── ATTENDANCE DEVICES ─────────────────────────────────────────────────────

  /api/v1/admin/attendance-devices/stats:
    get:
      tags: [Attendance Devices]
      summary: Get attendance devices statistics
      responses:
        "200":
          description: Attendance devices stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDeviceStats"

  /api/v1/admin/attendance-devices:
    get:
      tags: [Attendance Devices]
      summary: List attendance devices
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [all, online, offline, deactivated]
            default: all
        - name: search
          in: query
          schema:
            type: string
          example: "Main Gate"
      responses:
        "200":
          description: Paginated attendance devices list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDeviceListResponse"

    post:
      tags: [Attendance Devices]
      summary: Register a new attendance device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAttendanceDeviceRequest"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAttendanceDeviceResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Device conflict (duplicate serial number or IP:port)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


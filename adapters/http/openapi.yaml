  # ─── DEVICE TOKENS ───────────────────────────────────────────────────────────

  /api/v1/device-tokens:
    post:
      tags: [Device Tokens]
      summary: Register a device token for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  example: "fcm_token_abc123"
                platform:
                  type: string
                  enum: [android, ios]
                  example: "android"
      responses:
        "201":
          description: Token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    example: "dt_001"

  /api/v1/device-tokens/{uid}:
    delete:
      tags: [Device Tokens]
      summary: Unregister a device token
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "dt_001"
      responses:
        "200":
          description: Token unregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Device token unregistered"

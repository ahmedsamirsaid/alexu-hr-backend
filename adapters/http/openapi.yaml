openapi: 3.0.3
info:
  title: BanuMusa Leave Management API
  description: |
    HR and Leave Management System API.

    ## Authentication
    Most endpoints require a Bearer JWT token in the `Authorization` header.
    Use the `/api/v1/auth/otp/verify` or `/api/v1/auth/login` endpoints to obtain tokens.

  version: 1.0.0

servers:
  - url: https://hr-backend-production-c71e.up.railway.app
    description: Deployed backend
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: validation_error
      required: [error]

    UserOutput:
      type: object
      properties:
        uid:
          type: string
          example: "usr_abc123"
        phone:
          type: string
          example: "+966500000001"
        employeeUid:
          type: string
          nullable: true
          example: "emp_xyz789"
        employeeName:
          type: string
          nullable: true
          example: "Ahmed Al-Sayed"
        accessScope:
          type: string
          enum: [global, department, self]
          example: "department"
        roles:
          type: array
          items:
            type: string
          example: ["Department Manager"]
        permissions:
          type: array
          items:
            type: string
          example: ["employees:read", "leave:record"]
        managedDepartmentUids:
          type: array
          items:
            type: string
          example: ["dept_001", "dept_002"]

    CurrentUserRole:
      type: object
      properties:
        uid:
          type: string
          example: "role_department_manager"
        name:
          type: string
          example: "Department Manager"

    CurrentUserEmployee:
      type: object
      properties:
        uid:
          type: string
          example: "emp_xyz789"
        name:
          type: string
          example: "Ahmed Al-Sayed"
        email:
          type: string
          nullable: true
          example: "ahmed@example.com"
        hireDate:
          type: string
          format: date
          example: "2023-01-15"

    CurrentUserOutput:
      type: object
      properties:
        uid:
          type: string
          example: "usr_abc123"
        phone:
          type: string
          example: "+966500000001"
        employeeUid:
          type: string
          nullable: true
          example: "emp_xyz789"
        isActive:
          type: boolean
          example: true
        accessScope:
          type: string
          enum: [global, department, self]
          example: "department"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/CurrentUserRole"
        permissions:
          type: array
          items:
            type: string
          example: ["employees:read", "leave:read"]
        employee:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CurrentUserEmployee"

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: "#/components/schemas/UserOutput"

    Employee:
      type: object
      properties:
        uid:
          type: string
          example: "emp_xyz789"
        name:
          type: string
          example: "Ahmed Al-Sayed"
        mobile:
          type: string
          example: "+966500000001"
        governmentId:
          type: string
          example: "1234567890"
        universityId:
          type: string
          example: "U-00123"
        email:
          type: string
          nullable: true
          example: "ahmed@example.com"
        hireDate:
          type: string
          format: date
          example: "2023-01-15"
        status:
          type: string
          enum: [active, inactive]
          example: active

    EmployeeListItem:
      allOf:
        - $ref: "#/components/schemas/Employee"
        - type: object
          properties:
            departmentUid:
              type: string
              nullable: true
              example: "dept_001"
            user:
              nullable: true
              type: object
              properties:
                userUid:
                  type: string
                  example: "usr_abc123"
                phone:
                  type: string
                  example: "+966500000001"
                isActive:
                  type: boolean
                  example: true
                roles:
                  type: array
                  items:
                    type: string
                  example: ["employee"]

    LeaveRecord:
      type: object
      properties:
        uid:
          type: string
          example: "lr_001"
        startDate:
          type: string
          format: date
          example: "2024-06-01"
        endDate:
          type: string
          format: date
          example: "2024-06-05"
        days:
          type: integer
          example: 5
        notes:
          type: string
          nullable: true
          example: "Annual leave"

    LeaveRecordListItem:
      allOf:
        - $ref: "#/components/schemas/LeaveRecord"
        - type: object
          properties:
            leaveTypeUid:
              type: string
              example: "lt_annual"
            leaveTypeCode:
              type: string
              example: "ANNUAL"
            leaveTypeNameEn:
              type: string
              example: "Annual Leave"
            leaveTypeNameAr:
              type: string
              example: "إجازة سنوية"
            recordedAt:
              type: string
              format: date-time
              example: "2024-05-28T10:00:00Z"

    AllLeaveRecordListItem:
      allOf:
        - $ref: "#/components/schemas/LeaveRecordListItem"
        - type: object
          properties:
            employeeUid:
              type: string
              example: "emp_xyz789"
            employeeName:
              type: string
              example: "Ahmed Al-Sayed"

    Balance:
      type: object
      properties:
        leaveTypeUid:
          type: string
          example: "lt_annual"
        leaveTypeCode:
          type: string
          example: "ANNUAL"
        leaveTypeNameEn:
          type: string
          example: "Annual Leave"
        leaveTypeNameAr:
          type: string
          example: "إجازة سنوية"
        year:
          type: integer
          example: 2024
        initialBalance:
          type: integer
          example: 21
        usedBalance:
          type: integer
          example: 5
        remainingBalance:
          type: integer
          example: 16

    LeaveRequest:
      type: object
      properties:
        uid:
          type: string
          example: "req_001"
        employeeUid:
          type: string
          example: "emp_xyz789"
        employeeName:
          type: string
          example: "Ahmed Al-Sayed"
        leaveTypeUid:
          type: string
          example: "lt_annual"
        leaveTypeNameEn:
          type: string
          example: "Annual Leave"
        leaveTypeNameAr:
          type: string
          example: "إجازة سنوية"
        startDate:
          type: string
          format: date
          example: "2024-06-01"
        endDate:
          type: string
          format: date
          example: "2024-06-05"
        days:
          type: integer
          example: 5
        notes:
          type: string
          nullable: true
          example: "Family trip"
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
          example: pending
        currentStep:
          type: integer
          example: 1
        maxStep:
          type: integer
          example: 2
        submittedAt:
          type: string
          format: date-time
          example: "2024-05-28T10:00:00Z"
        decidedAt:
          type: string
          format: date-time
          nullable: true

    PendingApproval:
      type: object
      properties:
        uid:
          type: string
          example: "req_001"
        requesterUid:
          type: string
          example: "emp_xyz789"
        requesterName:
          type: string
          example: "Ahmed Al-Sayed"
        leaveTypeUid:
          type: string
          example: "lt_annual"
        leaveTypeNameEn:
          type: string
          example: "Annual Leave"
        leaveTypeNameAr:
          type: string
          example: "إجازة سنوية"
        startDate:
          type: string
          format: date
          example: "2024-06-01"
        endDate:
          type: string
          format: date
          example: "2024-06-05"
        days:
          type: integer
          example: 5
        currentStep:
          type: integer
          example: 1
        maxStep:
          type: integer
          example: 2
        submittedAt:
          type: string
          format: date-time
          example: "2024-05-28T10:00:00Z"

    ApprovalHistory:
      type: object
      properties:
        uid:
          type: string
          example: "act_001"
        action:
          type: string
          enum: [approved, rejected, cancelled]
          example: approved
        stepOrder:
          type: integer
          example: 1
        actorUid:
          type: string
          example: "emp_mgr001"
        actorName:
          type: string
          example: "Manager Name"
        comments:
          type: string
          nullable: true
          example: "Approved. Enjoy your leave."
        actedAt:
          type: string
          format: date-time
          example: "2024-05-29T09:00:00Z"

    Role:
      type: object
      properties:
        uid:
          type: string
          example: "role_001"
        name:
          type: string
          example: "approver"
        description:
          type: string
          example: "Can approve leave requests"
        scopeType:
          type: string
          enum: [global, department, self]
          example: "department"
        isSystem:
          type: boolean
          example: false
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    CreateRoleResponse:
      type: object
      properties:
        uid:
          type: string
          example: "role_001"

    Permission:
      type: object
      properties:
        uid:
          type: string
          example: "perm_001"
        code:
          type: string
          example: "leave:record"
        description:
          type: string
          example: "Record leave for employees"

    Department:
      type: object
      properties:
        uid:
          type: string
          example: "dept_001"
        code:
          type: string
          example: "ENG"
        nameEn:
          type: string
          example: "Engineering"
        nameAr:
          type: string
          nullable: true
          example: "هندسة"
        isActive:
          type: boolean
          example: true
        managerUid:
          type: string
          nullable: true
          example: "emp_mgr001"
        managerName:
          type: string
          nullable: true
          example: "Manager Name"

    ApprovalFlow:
      type: object
      properties:
        uid:
          type: string
          example: "af_001"
        code:
          type: string
          example: "TWO_STEP"
        nameEn:
          type: string
          example: "Two-Step Approval"
        nameAr:
          type: string
          nullable: true
          example: "موافقة من خطوتين"
        description:
          type: string
          nullable: true
          example: "Requires two approvers"
        isActive:
          type: boolean
          example: true

    ApprovalFlowStep:
      type: object
      properties:
        uid:
          type: string
          example: "afs_001"
        stepOrder:
          type: integer
          example: 1
        roleUid:
          type: string
          example: "role_001"
        roleName:
          type: string
          example: "approver"

    LeaveType:
      type: object
      properties:
        uid:
          type: string
          example: "lt_annual"
        code:
          type: string
          example: "ANNUAL"
        nameEn:
          type: string
          example: "Annual Leave"
        nameAr:
          type: string
          example: "إجازة سنوية"
        maxDaysPerYear:
          type: integer
          example: 21
        maxConsecutiveDays:
          type: integer
          nullable: true
          example: 14
        isActive:
          type: boolean
          example: true

    DashboardStats:
      type: object
      required:
        - totalEmployees
        - checkedInToday
        - checkedOutToday
        - leavesToday
        - pendingRequests
      properties:
        totalEmployees:
          type: integer
          description: Total employees visible to the current user's scope.
          example: 120
        checkedInToday:
          type: integer
          description: Distinct employees with at least one check-in or unknown attendance punch today.
          example: 95
        checkedOutToday:
          type: integer
          description: Distinct employees with at least one check-out or unknown attendance punch today.
          example: 80
        leavesToday:
          type: integer
          description: Distinct employees whose leave interval includes today's date.
          example: 5
        pendingRequests:
          type: integer
          description: Pending leave requests visible to the current user's scope.
          example: 3

    User:
      type: object
      properties:
        uid:
          type: string
          example: "usr_abc123"
        phone:
          type: string
          example: "+966500000001"
        isActive:
          type: boolean
          example: true
        employeeUid:
          type: string
          nullable: true
          example: "emp_xyz789"
        roles:
          type: array
          items:
            type: string
          example: ["admin"]

    Shift:
      type: object
      properties:
        uid:
          type: string
          example: "shf_general"
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "17:00"
        graceMinutes:
          type: integer
          example: 15

    ShiftListResponse:
      type: object
      properties:
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/Shift"

    ShiftRequest:
      type: object
      required: [startTime, endTime, graceMinutes]
      properties:
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "17:00"
        graceMinutes:
          type: integer
          example: 15

    AttendanceWorkHoursConfig:
      type: object
      properties:
        workDayStart:
          type: string
          example: "08:00"
        workDayEnd:
          type: string
          example: "16:00"
        lateGraceMinutes:
          type: integer
          example: 15
        earlyGraceMinutes:
          type: integer
          example: 10

    AttendanceDailySummaryItem:
      type: object
      properties:
        employeeUid:
          type: string
          example: "emp_xyz789"
        employeeName:
          type: string
          example: "Ahmed Al-Sayed"
        checkIn:
          type: string
          format: date-time
          nullable: true
          example: "2024-06-01T08:04:00Z"
        checkOut:
          type: string
          format: date-time
          nullable: true
          example: "2024-06-01T16:03:00Z"
        workedHours:
          type: number
          format: float
          example: 7.98
        lateArrival:
          type: boolean
          example: false
        earlyDeparture:
          type: boolean
          example: false
        missingCheckIn:
          type: boolean
          example: false
        missingCheckOut:
          type: boolean
          example: false

    AttendanceDailySummaryResponse:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-06-01"
        summaries:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceDailySummaryItem"

    AttendanceLogItem:
      type: object
      properties:
        uid:
          type: string
          example: "atr_001"
        employeeUid:
          type: string
          example: "emp_xyz789"
        employeeName:
          type: string
          example: "Ahmed Al-Sayed"
        departmentUid:
          type: string
          nullable: true
          example: "dept_001"
        deviceUid:
          type: string
          example: "adev_001"
        deviceName:
          type: string
          example: "Main Gate Reader"
        deviceUserId:
          type: string
          example: "1001"
        punchedAt:
          type: string
          format: date-time
          example: "2024-06-01T08:04:00Z"
        punchType:
          type: string
          enum: [check_in, check_out, break_start, break_end, unknown]
          example: check_in
        rawPayload:
          type: string
          nullable: true

    DepartmentAttendanceLogsResponse:
      type: object
      properties:
        departmentUid:
          type: string
          example: "dept_001"
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceLogItem"
        total:
          type: integer
          example: 44
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3

    EmployeeAttendanceLogsResponse:
      type: object
      properties:
        employeeUid:
          type: string
          example: "emp_xyz789"
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceLogItem"
        total:
          type: integer
          example: 44
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3

    AttendanceException:
      type: object
      properties:
        type:
          type: string
          enum:
            [
              missed_punch_in,
              missed_punch_out,
              late_arrival,
              early_departure,
              absence,
            ]
          example: late_arrival
        minutesDelta:
          type: integer
          nullable: true
          example: 12

    DailyAttendanceLogItem:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-06-01"
        employeeUid:
          type: string
          example: "emp_xyz789"
        employeeName:
          type: string
          example: "Ahmed Al-Sayed"
        departmentUid:
          type: string
          nullable: true
          example: "dept_001"
        checkIn:
          type: string
          nullable: true
          example: "08:04:00"
        checkOut:
          type: string
          nullable: true
          example: "16:03:00"
        checkInDevice:
          type: string
          nullable: true
          example: "Main Gate Reader"
        checkOutDevice:
          type: string
          nullable: true
          example: "Main Gate Reader"
        workedHours:
          type: number
          format: float
          example: 7.98
        lateArrival:
          type: boolean
          example: false
        earlyDeparture:
          type: boolean
          example: false
        missingCheckIn:
          type: boolean
          example: false
        missingCheckOut:
          type: boolean
          example: false
        exceptions:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceException"

    DepartmentDailyAttendanceLogsResponse:
      type: object
      properties:
        departmentUid:
          type: string
          example: "dept_001"
        records:
          type: array
          items:
            $ref: "#/components/schemas/DailyAttendanceLogItem"
        total:
          type: integer
          example: 44
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3

    EmployeeDailyAttendanceLogsResponse:
      type: object
      properties:
        employeeUid:
          type: string
          example: "emp_xyz789"
        records:
          type: array
          items:
            $ref: "#/components/schemas/DailyAttendanceLogItem"
        total:
          type: integer
          example: 20
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 1

    MonthlyWorkingHoursByDay:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-06-01"
        workedHours:
          type: number
          format: float
          example: 7.98

    MonthlyAttendanceStatsResponse:
      type: object
      properties:
        employeeUid:
          type: string
          example: "emp_xyz789"
        month:
          type: string
          description: Selected period label (for example YYYY-MM, YYYY, or custom start/end range)
          example: "2024-06"
        totalWorkedHours:
          type: number
          format: float
          example: 123.5
        averageCheckInTime:
          type: string
          nullable: true
          example: "08:07:14"
        averageCheckOutTime:
          type: string
          nullable: true
          example: "17:03:22"
        missingCheckInCount:
          type: integer
          example: 2
        missingCheckOutCount:
          type: integer
          example: 1
        workingHoursByDay:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyWorkingHoursByDay"

    AttendanceDevice:
      type: object
      properties:
        uid:
          type: string
          example: "adev_001"
        ip:
          type: string
          example: "192.168.1.10"
        port:
          type: integer
          example: 4370
        name:
          type: string
          example: "Main Gate Reader"
        location:
          type: string
          example: "Building A - Gate 1"
        serialNumber:
          type: string
          example: "ZK-123456"
        status:
          type: string
          enum: [online, offline, deactivated]
          example: offline
        lastStatusKnownAt:
          type: string
          format: date-time
          example: "2024-06-01T08:10:00Z"

    AttendanceDeviceListResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceDevice"
        total:
          type: integer
          example: 6
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 1

    AttendanceDeviceStats:
      type: object
      properties:
        total:
          type: integer
          example: 6
        online:
          type: integer
          example: 4
        offline:
          type: integer
          example: 2
        deactivated:
          type: integer
          example: 1

    AttendanceDeviceConnectionCheck:
      type: object
      properties:
        uid:
          type: string
          example: "adev_001"
        status:
          type: string
          enum: [online, offline]
          example: online
        reachable:
          type: boolean
          example: true
        checkedAt:
          type: string
          format: date-time
          example: "2024-06-01T08:15:00Z"

    AttendanceDeviceCheckAllConnections:
      type: object
      properties:
        checkedCount:
          type: integer
          example: 6
        online:
          type: integer
          example: 4
        offline:
          type: integer
          example: 2
        checkedAt:
          type: string
          format: date-time
          example: "2024-06-01T08:15:00Z"

    RegisterAttendanceDeviceRequest:
      type: object
      required: [ip, port, name, serialNumber]
      properties:
        ip:
          type: string
          example: "192.168.1.10"
        port:
          type: integer
          example: 4370
        name:
          type: string
          example: "Main Gate Reader"
        location:
          type: string
          example: "Building A - Gate 1"
        serialNumber:
          type: string
          example: "ZK-123456"

    UpdateAttendanceDeviceRequest:
      type: object
      required: [ip, port, name]
      properties:
        ip:
          type: string
          example: "192.168.1.10"
        port:
          type: integer
          example: 4370
        name:
          type: string
          example: "Main Gate Reader"
        location:
          type: string
          example: "Building A - Gate 1"

    RegisterAttendanceDeviceResponse:
      type: object
      properties:
        uid:
          type: string
          example: "adev_001"

    WeekendConfigResponse:
      type: object
      properties:
        weekendDays:
          type: array
          items:
            type: integer
          example: [5, 6]

    HolidayItem:
      type: object
      properties:
        uid:
          type: string
          example: "hdef_001"
        date:
          type: string
          format: date
          example: "2026-04-25"
        name:
          type: string
          example: "Sinai Liberation Day"
        localName:
          type: string
          nullable: true
          example: "عيد تحرير سيناء"
        isManual:
          type: boolean
          example: true

    ListHolidaysResponse:
      type: object
      properties:
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/HolidayItem"
        weekendDays:
          type: array
          items:
            type: integer
          example: [5, 6]

    CreateAttendanceLogRequest:
      type: object
      required: [employeeUid, deviceUid, punchedAt, punchType]
      properties:
        employeeUid:
          type: string
          example: "emp_xyz789"
        deviceUid:
          type: string
          example: "adev_001"
        punchedAt:
          type: string
          format: date-time
          example: "2026-04-20T08:30:00Z"
        punchType:
          type: string
          enum: [check_in, check_out, break_start, break_end, unknown]
          example: check_in

    UpdateAttendanceLogRequest:
      type: object
      required: [deviceUid, punchedAt, punchType]
      properties:
        deviceUid:
          type: string
          example: "adev_001"
        punchedAt:
          type: string
          format: date-time
          example: "2026-04-20T17:00:00Z"
        punchType:
          type: string
          enum: [check_in, check_out, break_start, break_end, unknown]
          example: check_out

    AttendanceLogMutationResponse:
      type: object
      properties:
        uid:
          type: string
          example: "atr_001"
        employeeUid:
          type: string
          example: "emp_xyz789"
        deviceUid:
          type: string
          example: "adev_001"
        deviceUserId:
          type: string
          example: "dusr_123"
        punchedAt:
          type: string
          format: date-time
          example: "2026-04-20T17:00:00Z"
        punchType:
          type: string
          enum: [check_in, check_out, break_start, break_end, unknown]
          example: check_out
        rawPayload:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          example: "2026-04-20T17:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-04-20T17:00:00Z"

    SendTestPushRequest:
      type: object
      required: [userUid]
      properties:
        userUid:
          type: string
          example: "usr_abc123"
        title:
          type: string
          example: "Manual test"
        body:
          type: string
          example: "Ping from admin"
        data:
          type: object
          additionalProperties:
            type: string

    SendTestPushResponse:
      type: object
      properties:
        sentCount:
          type: integer
          example: 1

paths:
  # ─── AUTH ───────────────────────────────────────────────────────────────────

  /api/v1/auth/otp/request:
    post:
      tags: [Auth]
      summary: Request OTP
      description: Send a one-time password to the given phone number. In dev mode use OTP `112233`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+966500000001"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OTP sent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and get tokens
      description: Verify the OTP code and receive access + refresh tokens. Dev bypass OTP is `112233`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                  example: "+966500000001"
                otp:
                  type: string
                  example: "112233"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User inactive or web access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with password
      description: Authenticate using phone number and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  example: "+966500000001"
                password:
                  type: string
                  example: "secret123"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserOutput"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── DASHBOARD ──────────────────────────────────────────────────────────────

  /api/v1/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics
      description: Returns today's scoped summary counts used by the dashboard cards.
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─── EMPLOYEES ──────────────────────────────────────────────────────────────

  /api/v1/employees:
    get:
      tags: [Employees]
      summary: List employees
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
          example: active
        - name: hire_date_from
          in: query
          schema:
            type: string
            format: date
          example: "2023-01-01"
        - name: hire_date_to
          in: query
          schema:
            type: string
            format: date
          example: "2024-12-31"
        - name: role
          in: query
          schema:
            type: string
          example: "employee"
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmployeeListItem"

  /api/v1/employees/{uid}:
    get:
      tags: [Employees]
      summary: Get employee by UID
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "emp_xyz789"
      responses:
        "200":
          description: Employee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/employees/{uid}/department:
    put:
      tags: [Employees]
      summary: Assign employee to department
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "emp_xyz789"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentUid]
              properties:
                departmentUid:
                  type: string
                  example: "dept_001"
      responses:
        "204":
          description: Assigned
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Employees]
      summary: Remove employee from department
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "emp_xyz789"
      responses:
        "204":
          description: Removed

  /api/v1/employees/import:
    post:
      tags: [Employees]
      summary: Import employees from XLSX
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                    example: 42
                  errors:
                    type: array
                    items:
                      type: string

  /api/v1/employees/export:
    get:
      tags: [Employees]
      summary: Export employees as CSV
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: hire_date_from
          in: query
          schema:
            type: string
            format: date
        - name: hire_date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /api/v1/employees/export/pdf:
    get:
      tags: [Employees]
      summary: Export employees as PDF
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: hire_date_from
          in: query
          schema:
            type: string
            format: date
        - name: hire_date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: PDF file download
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/v1/employees/import/template:
    get:
      tags: [Employees]
      summary: Download import XLSX template
      responses:
        "200":
          description: XLSX template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /api/v1/employees/{employeeUid}/balance:
    get:
      tags: [Leave]
      summary: Get employee leave balances
      parameters:
        - name: employeeUid
          in: path
          required: true
          schema:
            type: string
          example: "emp_xyz789"
        - name: year
          in: query
          schema:
            type: integer
          example: 2024
      responses:
        "200":
          description: Leave balances for the employee
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Balance"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/employees/{employeeUid}/leave-records:
    get:
      tags: [Leave]
      summary: Get leave records for an employee
      parameters:
        - name: employeeUid
          in: path
          required: true
          schema:
            type: string
          example: "emp_xyz789"
        - name: leaveTypeUid
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          example: "2024-12-31"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Leave records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveRecordListItem"
                  total:
                    type: integer
                    example: 10
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20

  # ─── LEAVE (direct recording) ────────────────────────────────────────────────

  /api/v1/leave:
    post:
      tags: [Leave]
      summary: Record leave directly for an employee (admin)
      description: Directly records leave without going through the approval workflow. Requires `leave:record` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeUid, leaveTypeUid, startDate, endDate]
              properties:
                employeeUid:
                  type: string
                  example: "emp_xyz789"
                leaveTypeUid:
                  type: string
                  example: "lt_annual"
                startDate:
                  type: string
                  format: date
                  example: "2024-06-01"
                endDate:
                  type: string
                  format: date
                  example: "2024-06-05"
                notes:
                  type: string
                  example: "Annual leave"
      responses:
        "201":
          description: Leave recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveRecord"
        "400":
          description: Invalid input (insufficient balance, bad date range, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/leave-records:
    get:
      tags: [Leave]
      summary: List all leave records (admin)
      description: Paginated list of all employees' leave records. Requires `leave:read` permission.
      parameters:
        - name: search
          in: query
          schema:
            type: string
          example: "Ahmed"
        - name: leaveTypeUid
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          example: "2024-12-31"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated leave records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/AllLeaveRecordListItem"
                  total:
                    type: integer
                    example: 100
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20

  # ─── LEAVE REQUESTS ──────────────────────────────────────────────────────────

  /api/v1/leave-requests:
    post:
      tags: [Leave Requests]
      summary: Submit a leave request
      description: Employee submits a leave request for approval. Auto-approved if no approval flow is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveTypeUid, startDate, endDate]
              properties:
                leaveTypeUid:
                  type: string
                  example: "lt_annual"
                startDate:
                  type: string
                  format: date
                  example: "2024-06-01"
                endDate:
                  type: string
                  format: date
                  example: "2024-06-05"
                notes:
                  type: string
                  example: "Family trip"
      responses:
        "201":
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [Leave Requests]
      summary: List my leave requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated leave requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveRequest"
                  total:
                    type: integer
                    example: 5
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20

  /api/v1/leave-requests/{uid}:
    get:
      tags: [Leave Requests]
      summary: Get a leave request by UID
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "req_001"
      responses:
        "200":
          description: Leave request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/leave-requests/{uid}/cancel:
    post:
      tags: [Leave Requests]
      summary: Cancel a leave request
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "req_001"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Leave request cancelled successfully"
        "400":
          description: Cannot cancel (wrong status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── APPROVALS ───────────────────────────────────────────────────────────────

  /api/v1/approvals/pending:
    get:
      tags: [Approvals]
      summary: List pending approvals (for current approver)
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingApproval"

  /api/v1/approvals/{uid}/approve:
    post:
      tags: [Approvals]
      summary: Approve a leave request
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "req_001"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: string
                  example: "Approved. Have a great time!"
      responses:
        "200":
          description: Approval result
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    example: "req_001"
                  status:
                    type: string
                    example: "approved"
                  currentStep:
                    type: integer
                    example: 2
                  leaveRecordCreated:
                    type: boolean
                    example: true

  /api/v1/approvals/{uid}/reject:
    post:
      tags: [Approvals]
      summary: Reject a leave request
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "req_001"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: string
                  example: "Insufficient cover during this period."
      responses:
        "200":
          description: Rejection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    example: "req_001"
                  status:
                    type: string
                    example: "rejected"

  /api/v1/approvals/{uid}/history:
    get:
      tags: [Approvals]
      summary: Get approval history for a request
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "req_001"
      responses:
        "200":
          description: Approval history
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalHistory"

  # ─── USERS ───────────────────────────────────────────────────────────────────

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer

    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+966500000099"
                password:
                  type: string
                  example: "secret123"
                employeeUid:
                  type: string
                  example: "emp_xyz789"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/users/{uid}:
    put:
      tags: [Users]
      summary: Update a user
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "usr_abc123"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: "+966500000099"
                password:
                  type: string
                  example: "newpassword"
                employeeUid:
                  type: string
                  example: "emp_xyz789"
                isActive:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User updated"

  /api/v1/users/{uid}/roles:
    post:
      tags: [Users]
      summary: Assign role to user
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "usr_abc123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleUid]
              properties:
                roleUid:
                  type: string
                  example: "role_001"
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Role assigned"

  /api/v1/users/{uid}/roles/{roleUid}:
    delete:
      tags: [Users]
      summary: Remove role from user
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: "usr_abc123"
        - name: roleUid
          in: path
          required: true
          schema:
            type: string
          example: "role_001"
      responses:
        "200":

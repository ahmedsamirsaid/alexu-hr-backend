[databases]
banumusa = host=34ba829b7e61 port=5432 dbname=banumusa user=banumusa

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
server_lifetime = 3600
server_idle_timeout = 600
query_timeout = 30
log_connections = 0
log_disconnections = 0